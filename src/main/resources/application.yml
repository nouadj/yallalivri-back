spring:
  application:
    name: yalla-livri-jpa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/yalla_livri}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    expo-base-url: ${EXPO_BASE_URL:https://exp.host}
    courier-radius-km: ${COURIER_RADIUS_KM:20.0}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Admin}

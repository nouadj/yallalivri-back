databaseChangeLog:
  - changeSet:
      id: 002-create-orders-table
      author: nadjtech
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: courier_id
                  type: BIGINT
              - column:
                  name: customer_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: customer_phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: customer_address
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DOUBLE PRECISION
              - column:
                  name: delivery_fee
                  type: DOUBLE PRECISION
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: store_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_store
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: courier_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_courier

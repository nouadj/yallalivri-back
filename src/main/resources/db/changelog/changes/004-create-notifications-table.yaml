databaseChangeLog:
  - changeSet:
      id: 004-create-notifications-table
      author: yalla
      changes:
        - createTable:
            tableName: user_notifications
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: user_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: order_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: type, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: title, type: VARCHAR(180), constraints: {nullable: false}}
              - column: {name: body, type: VARCHAR(500), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: read_at, type: TIMESTAMP}
        - addForeignKeyConstraint:
            baseTableName: user_notifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_user
            onDelete: CASCADE
        - createIndex:
            tableName: user_notifications
            indexName: idx_notifications_user_id
            columns:
              - column: {name: user_id}
              - column: {name: id}
        - createIndex:
            tableName: user_notifications
            indexName: idx_notifications_unread
            columns:
              - column: {name: user_id}
              - column: {name: read_at}
